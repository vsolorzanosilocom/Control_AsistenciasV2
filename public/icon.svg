<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="cylinderBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="35%" stop-color="#ef4444" />
      <stop offset="70%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="cylinderTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="radarPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#065f46" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="109" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Geofence Radar Circular Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.25" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />
  <circle cx="256" cy="256" r="85" fill="none" stroke="#10b981" stroke-width="2" opacity="0.4" />

  <!-- Radar Sweep Cone -->
  <path d="M 256 256 L 380 180 A 150 150 0 0 0 256 106 Z" fill="url(#radarPulse)" />

  <!-- Subtle Satellite / GPS Grid Nodes -->
  <circle cx="256" cy="76" r="5" fill="#10b981" filter="url(#glow)" />
  <circle cx="436" cy="256" r="4" fill="#38bdf8" opacity="0.7" />
  <circle cx="76" cy="256" r="4" fill="#38bdf8" opacity="0.7" />
  <circle cx="256" cy="436" r="4" fill="#10b981" opacity="0.5" />

  <!-- Silocom Iconic 3D Red Cylinder ("i" element) -->
  <g transform="translate(0, -10)">
    <!-- Shadow beneath cylinder -->
    <ellipse cx="256" cy="360" rx="34" ry="12" fill="#000000" opacity="0.6" />

    <!-- Cylinder Body -->
    <path d="M 226 230 L 226 345 A 30 14 0 0 0 286 345 L 286 230 Z" fill="url(#cylinderBody)" />

    <!-- Cylinder Top Cap with High-Precision 3D Rim -->
    <ellipse cx="256" cy="230" rx="30" ry="14" fill="url(#cylinderTop)" stroke="#fee2e2" stroke-width="1" />

    <!-- Specular Highlight Line on Cylinder Body -->
    <line x1="244" y1="234" x2="244" y2="343" stroke="#ffffff" stroke-width="2.5" opacity="0.45" stroke-linecap="round" />

    <!-- Emerald Checkmark Badge / Attendance Indicator (bottom right) -->
    <g transform="translate(290, 310)">
      <circle cx="20" cy="20" r="22" fill="#090d16" stroke="#10b981" stroke-width="3" filter="url(#glow)" />
      <path d="M 12 20 L 17 25 L 28 14" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Corporate Wordmark Bottom -->
  <text x="256" y="445" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" letter-spacing="6">SILOCOM</text>
  <text x="256" y="475" text-anchor="middle" fill="#10b981" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14" letter-spacing="3">ASISTENCIAS</text>
</svg>
